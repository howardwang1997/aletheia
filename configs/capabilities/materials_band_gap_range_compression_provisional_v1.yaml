preregistration_schema:
  schema_id: materials.band_gap.range_compression.preregistration
  version: 1.0.0
  media_type: application/schema+json
  json_schema:
    type: object
    properties:
      protocol_sha256:
        type: string
        pattern: "^[0-9a-f]{64}$"
      selected_candidate_id:
        const: candidate.unseen_vs_seen_control
      frozen_seeds:
        type: array
        items:
          type: integer
        minItems: 5
        maxItems: 5
    required: [protocol_sha256, selected_candidate_id, frozen_seeds]
    additionalProperties: false
  json_schema_sha256: c9996362eae9155150d8c1660d421885aa46fc1060a45a6870e4363eeb53ef09

controls_required:
  - control_id: control.negative.represented_system
    kind: negative_control
    description: Held-out rows from chemical systems that remain represented in training.
    required: true
  - control_id: control.positive.synthetic_compression
    kind: positive_control
    description: Synthetic fixture with a known additional unseen-system compression effect.
    required: true

assumptions:
  - assumption_id: assumption.comparable_units
    statement: All target values share experimental band-gap semantics in eV.
    violation_consequence: Prediction-spread comparisons become uninterpretable.
    test_or_monitor: Require target/unit metadata and the frozen Matbench dataset identity.
  - assumption_id: assumption.group_identity
    statement: Pymatgen chemical-system identity is the relevant generalization grouping.
    violation_consequence: The contrast may not isolate the intended unseen-chemistry boundary.
    test_or_monitor: Retain group hashes and report this construct limitation.

known_failure_modes:
  - failure_id: failure.partition_instability
    description: Outcome classification changes across preregistered partition seeds.
    detection: Execute every frozen replication slot and report heterogeneity.
    disposition: exploratory_only
  - failure_id: failure.public_retrospective
    description: Public labels and earlier partitions informed the hypothesis and protocol.
    detection: Preserve contamination disclosure in every result.
    disposition: exploratory_only

minimum_sample_rule:
  sampling_unit: chemical_system
  minimum_count: 100
  power_or_precision_rule: Each unseen/control comparison must include at least 100 chemical systems.
  rule_sha256: 9464d689f1ce08c0579befe6ca159884603d9a2cb56f953f80b52b6ad155d28b

resources:
  estimated_cost_usd: 1.0
  estimated_wall_time_seconds: 180
  cpu_seconds: 180
  memory_mb: 4096
  gpu_seconds: 0
  external_resource_units: {}

nondeterminism_policy:
  mode: frozen_seeds
  frozen_seeds: [20260818, 20260819, 20260820, 20260821, 20260822]
  maximum_attempts_per_slot: 1
  best_of_n_forbidden: true
  aggregation_rule: Retain and aggregate every one of the five preregistered partition slots.
  stopping_rule: Run all five slots without efficacy, futility, or significance stopping.

reproduction_policy:
  minimum_exact_reexecutions: 2
  independent_validator_recomputation: true
  independent_implementation_required: false
  independent_dataset_required: false
  metric_tolerance: 1.0e-12
  failure_retention: true

safety_class: low_risk_compute
