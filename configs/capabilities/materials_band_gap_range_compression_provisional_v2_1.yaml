nondeterminism_policy:
  mode: frozen_seeds
  frozen_seeds:
  - 20260818
  - 20260819
  - 20260820
  - 20260821
  - 20260822
  maximum_attempts_per_slot: 1
  best_of_n_forbidden: true
  aggregation_rule: Retain all five slots; classify a pattern only with at least four
    matching outcomes.
  stopping_rule: Run all five slots without efficacy, futility, or significance stopping.
reproduction_policy:
  minimum_exact_reexecutions: 2
  independent_validator_recomputation: true
