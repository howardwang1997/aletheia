controls_required:
- control_id: control.negative.represented_system
  kind: negative_control
  description: Held-out rows from chemical systems that remain represented in training.
  required: true
- control_id: control.positive.synthetic_compression
  kind: positive_control
  description: Synthetic fixture with a known additional unseen-system compression
    effect.
  required: true
assumptions:
- assumption_id: assumption.comparable_units
  statement: All target values share experimental band-gap semantics in eV.
  violation_consequence: Prediction-spread comparisons become uninterpretable.
  test_or_monitor: Require target/unit metadata and the frozen Matbench dataset identity.
- assumption_id: assumption.group_identity
  statement: Pymatgen chemical-system identity is the relevant generalization grouping.
  violation_consequence: The contrast may not isolate the intended unseen-chemistry
    boundary.
  test_or_monitor: Retain group hashes and report this construct limitation.
known_failure_modes:
- failure_id: failure.partition_instability
  description: Outcome classification changes across preregistered partition seeds.
  detection: Execute every frozen replication slot and report heterogeneity.
  disposition: exploratory_only
- failure_id: failure.public_retrospective
  description: Public labels and earlier partitions informed the hypothesis and protocol.
  detection: Preserve contamination disclosure in every result.
  disposition: exploratory_only
minimum_sample_rule:
  sampling_unit: chemical_system
  minimum_count: 100
  power_or_precision_rule: Each unseen/control comparison must include at least 100
    chemical systems.
  rule_sha256: 9464d689f1ce08c0579befe6ca159884603d9a2cb56f953f80b52b6ad155d28b
resources:
  estimated_cost_usd: 1.0
