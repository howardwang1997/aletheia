input_schema:
  schema_id: materials.simulation.ase_emt_eos_reference.job
  version: 1.0.0
  media_type: application/schema+json
  json_schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    properties:
      schema_name:
        const: aletheia.ase_emt_eos_job
      schema_version:
        const: 1
      job_id:
        type: string
        pattern: ^[a-zA-Z0-9][a-zA-Z0-9_.-]{1,127}$
      calculator:
        type: object
        properties:
          name:
            const: ase.emt
          asap_cutoff:
            const: false
        required:
        - name
        - asap_cutoff
        additionalProperties: false
      structure:
        type: object
        properties:
          symbols:
            type: array
            minItems: 1
            maxItems: 256
            items:
              type: string
          positions_angstrom:
            type: array
            minItems: 1
            maxItems: 256
            items:
              type: array
              minItems: 3
              maxItems: 3
              items:
                type: number
          cell_angstrom:
            type: array
            minItems: 3
            maxItems: 3
            items:
              type: array
              minItems: 3
              maxItems: 3
              items:
                type: number
          pbc:
            type: array
            minItems: 3
            maxItems: 3
            items:
              const: true
        required:
        - symbols
        - positions_angstrom
        - cell_angstrom
        - pbc
        additionalProperties: false
      scan:
        type: object
        properties:
          eos_model:
            const: sj
          points:
            type: integer
            minimum: 5
            maximum: 31
          volume_strain_fraction:
            type: number
            minimum: 0.005
            maximum: 0.20
        required:
        - eos_model
        - points
        - volume_strain_fraction
        additionalProperties: false
    required:
    - schema_name
    - schema_version
    - job_id
    - calculator
    - structure
    - scan
    additionalProperties: false
  json_schema_sha256: a7e311c592cecc39ec03c04f0232c6a2f5c56325e9dcc885874513cf0e70bb4a

