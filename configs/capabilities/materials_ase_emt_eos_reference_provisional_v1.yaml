controls_required:
- control_id: control.negative.unsupported_element_failure
  kind: negative_control
  description: An element outside ASE EMT support must remain an execution failure, never a finite physical result.
  required: true
- control_id: control.positive.ase_official_cu_fcc_eos
  kind: positive_control
  description: Frozen Cu fcc input must reproduce the ASE documentation lattice constant and exact image-local result payload.
  required: true

assumptions:
- assumption_id: assumption.classical_scope
  statement: ASE EMT is an empirical classical potential and is not a first-principles electronic-structure method.
  violation_consequence: The evidence would be mislabeled as DFT, experimental, transferable, or mechanistic.
  test_or_monitor: Freeze the classical-only claim ceiling in protocol, validation, manifest, and reports.
- assumption_id: assumption.exact_runtime
  statement: Numerical calibration applies only to the exact image, worker, runtime versions, job, and scan.
  violation_consequence: Exact payload comparison and the documented tolerance may no longer be valid.
  test_or_monitor: Reject any image, source, version, job, or protocol digest drift before parsing.
- assumption_id: assumption.reference_equivalence
  statement: Primitive one-atom fcc Cu volume maps to conventional lattice constant by a=(4V)^(1/3).
  violation_consequence: The gold comparison would test the wrong physical quantity.
  test_or_monitor: Derive the relation mechanically and compare with the frozen ASE reference value.

known_failure_modes:
- failure_id: failure.container_infrastructure
  description: Image, platform, bind mount, daemon, or container lifecycle is unavailable or inconsistent.
  detection: Retain infrastructure status, exit code, stderr, and cleanup receipt; reject execution.
  disposition: blocked
- failure_id: failure.eos_quality
  description: The fitted minimum is unbracketed, residuals exceed policy, or bulk modulus is outside the calibration range.
  detection: Independently derive all frozen numerical quality and gold checks from retained points.
  disposition: invalid
- failure_id: failure.output_quota
  description: The worker emits too many files, unknown file types, a symlink, or too many bytes.
  detection: Read the bounded output directory through the host quota and regular-file gate.
  disposition: blocked
- failure_id: failure.timeout
  description: The container does not exit within the frozen wall-clock budget.
  detection: Kill and remove the exact named container, retain partial output, and mark timed_out.
  disposition: blocked
- failure_id: failure.unsupported_element
  description: ASE EMT has no potential parameters for one or more requested elements.
  detection: Worker returns a typed failure artifact and no result; parser preserves execution failure.
  disposition: invalid

minimum_sample_rule:
  sampling_unit: reference_system
  minimum_count: 1
  power_or_precision_rule: One frozen reference system calibrates only this adapter; it supports no population inference or transfer claim.
  rule_sha256: 4dd86c102ed0d907369ddf70f062a2c420f071d30dc5aa85625fbf17a58f2a76

resources:
  estimated_cost_usd: 0.0
  estimated_wall_time_seconds: 10
  cpu_seconds: 10
  memory_mb: 256
  gpu_seconds: 0
  external_resource_units: {}

nondeterminism_policy:
  mode: deterministic
  frozen_seeds: []
  maximum_attempts_per_slot: 1
  best_of_n_forbidden: true
  aggregation_rule: Retain one result or one typed failure per frozen run; never select among attempts.
  stopping_rule: Execute one bounded attempt per run slot and retain timeout, quota, infrastructure, and worker failures.

reproduction_policy:
  minimum_exact_reexecutions: 2
  independent_validator_recomputation: true
  independent_implementation_required: false
  independent_dataset_required: false
  metric_tolerance: 0.0
  failure_retention: true

safety_class: low_risk_compute
approval_class: operator
