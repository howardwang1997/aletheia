[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# The runtime URL comes from ALETHEIA_DATABASE_URL through aletheia.config.
# Keeping credentials out of this file makes the checked-in migration config safe.
sqlalchemy.url = postgresql+psycopg://aletheia:aletheia@localhost:5432/aletheia

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
