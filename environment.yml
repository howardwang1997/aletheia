name: aletheia
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # --- materials / scientific stack (conda-forge ships prebuilt wheels; avoids
  #     source builds. NB: the `matbench` PyPI package pins an ancient scikit-learn
  #     that won't build on py3.11 — we load the same expt_gap data via matminer
  #     and do our own fixed-seed split instead.) ---
  - numpy
  - pandas
  - scikit-learn
  - matplotlib              # parity plots / artifacts
  - cloudpickle             # robust model persistence: pickles coder-authored custom estimator classes BY VALUE (joblib pickles by reference, which fails for classes defined in the dynamically-loaded solution module)
  - pymatgen                # Composition parsing
  - matminer                # Magpie composition featurizer + expt_gap dataset loader
  - ase                     # atomistic simulation interface + deterministic EMT reference calculator
  - xgboost                 # SOTA gradient boosting (coder may use it; harness still evaluates)
  - lightgbm                # SOTA gradient boosting
  - rdkit                   # molecules domain: SMILES -> ECFP fingerprints + Bemis-Murcko scaffolds (host-side)
  - pip:
      # --- agent runtime ---
      - claude-agent-sdk
      - anthropic
      # --- cross-vendor critics (Phase 1+) ---
      - openai
      - google-genai
      - zhipuai
      # --- backend ---
      - fastapi
      - "uvicorn[standard]"
      - sse-starlette
      - python-multipart        # FastAPI file uploads (dataset registration)
      - "pydantic>=2"
      - pydantic-settings
      - "SQLAlchemy>=2"
      - alembic
      - "psycopg[binary]>=3"
      - pgvector
      - sentence-transformers   # local embeddings for semantic recall (all-MiniLM-L6-v2)
      - python-dotenv
      - PyYAML
      - httpx
      - tenacity
      - mp-api                  # Materials Project (optional, needs MP_API_KEY)
      - githubkit               # GitHub App auth (IAM: repo/branch/PR per experiment)
      # --- dev ---
      - pytest
      - pytest-asyncio
      - ruff
