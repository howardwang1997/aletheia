# Critic Gateway roster. The default panel runs ALL configured vendors on every
# critique pass, each producing a supportive AND an adversarial stance.
# Always pin to the latest model generation per vendor (no outdated models).
#
# transport: "api" (default) or "cli" (subprocess, e.g. OpenAI Codex). Only opt
# into "cli" where a sanctioned subscription exists; "api" is the reliable default.

# Phase 2: cross-model peer-review panel. Each gate fans out to several DISTINCT
# vendor models (no same-model self-play), each reviewing in an isolated context,
# then rebutting over dynamic rounds (see `rounds`) to a rule-based consensus.
# Default panel = OpenAI + Gemini + DeepSeek (3 distinct models); Zhipu is an
# available spare. Always pin to the latest generation per vendor.
panel:
  # TEMPORARY DEFAULT: Claude-only. Codex's subscription token is burned (needs
  # `codex login`) and GLM's Coding-Plan quota window is exhausted, so both currently
  # error every call and only slow the gate down. Run on the reliable machine Claude
  # login for now; flip `openai`/`zhipu` back to enabled for true cross-vendor review
  # once their credentials recover (NB: single-vendor = same-model self-review).
  - id: openai
    enabled: false           # re-enable after `codex login`
    transport: cli            # Codex CLI on the Coding Plan (api = OPENAI_API_KEY)
    model: gpt-5.5            # latest OpenAI
  - id: anthropic
    enabled: true             # Claude CLI on the machine's Coding Plan login (no key) —
    transport: cli            # the most reliable critic credential (same login as the
    model: claude-opus-4-8    # orchestrator). The default reviewer for now.
  - id: gemini
    enabled: true
    transport: api
    model: gemini-latest      # resolve to the newest Gemini at call time
  - id: deepseek
    enabled: true
    transport: api
    model: deepseek-chat      # latest DeepSeek (OpenAI-compatible API)
    base_url: https://api.deepseek.com
  - id: zhipu
    enabled: true             # CHINA-reachable auditor for DIRECT runs (Western critics flake on
                              # direct). If the GLM Coding-Plan quota is still out it 1113-fails-fast
                              # (no retry) and drops cleanly — no worse than disabled. Key from OpenCode.
    transport: api
    model: glm-5.1            # latest GLM on the Coding Plan
    # the Coding Plan is served ONLY by the /coding/ endpoint; the standard
    # /api/paas/v4 returns 1113 "余额不足" (no pay-as-you-go balance).
    base_url: https://open.bigmodel.cn/api/coding/paas/v4
  - id: grok
    enabled: true             # xAI Grok — independent 3rd-party vendor; restores genuine
    transport: api            # cross-vendor review alongside Claude while Codex/GLM are
    model: grok-4.3           # down. Key read from ../sciminer/.env (GROK_API_KEY).
    base_url: https://api.x.ai/v1

# Gate policy: how the per-model verdicts combine into CritiquePanel.gate_passed.
consensus:
  # "any_blocker" -> gate fails if any reviewer returns an unrefuted `blocker`.
  # "majority"    -> gate passes if a majority verdict is approve/approve_with_changes.
  rule: any_blocker
  max_design_iterations: 3

# Dynamic, disagreement-driven rebuttal depth. Important gates (design/results) can
# run up to N rounds; rounds early-stop once reviewers converge (disagreement below
# the threshold). Minor targets resolve in a single round.
rounds:
  dynamic: true
  disagreement_threshold: 0.34   # fraction of reviewers dissenting -> run another round
  importance:
    design: 5
    results: 5
    direction: 1
    default: 1
